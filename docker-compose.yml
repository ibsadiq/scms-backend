services:
  ssync-postgres:
    image: postgres:16-alpine
    container_name: ssync-postgres
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - ssync-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ssync}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - utonez
  ssync-redis:
    image: redis:7-alpine
    container_name: ssync-redis
    restart: unless-stopped
    networks:
      - utonez
  ssync-backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ssync-backend
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      ssync-postgres:
        condition: service_healthy
      ssync-redis:
        condition: service_started
    command: ["gunicorn", "school.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "4", "--timeout", "120"]
    networks:
      - utonez
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=utonez"
      - "traefik.http.routers.ssync.rule=Host(`api.ssyncportal.com`)"
      - "traefik.http.routers.ssync.entrypoints=https"
      - "traefik.http.routers.ssync.tls=true"
      - "traefik.http.routers.ssync.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ssync.service=ssync"
      - "traefik.http.services.ssync.loadbalancer.server.port=8000"
      - "traefik.http.services.ssync.loadbalancer.passhostheader=true"
      - "traefik.http.routers.ssync-http.entrypoints=http"
      - "traefik.http.routers.ssync-http.middlewares=redirect-to-https"
      - "traefik.http.routers.ssync-http.priority=1"
  ssync-celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ssync-celery-worker
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      ssync-postgres:
        condition: service_healthy
      ssync-redis:
        condition: service_started
    command: ["celery", "-A", "school", "worker", "--loglevel=info"]
    networks:
      - utonez
  ssync-celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ssync-celery-beat
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      ssync-postgres:
        condition: service_healthy
      ssync-redis:
        condition: service_started
    command: ["celery", "-A", "school", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    networks:
      - utonez
volumes:
  ssync-pgdata:
networks:
  utonez:
    external: true