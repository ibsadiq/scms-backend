{% extends 'email/base.html' %}

{% block content %}
<h1 style="color: #1f2937; margin-bottom: 20px;">🆕 New School Registration</h1>

<p style="color: #4b5563; line-height: 1.6;">A new school has registered and is pending approval:</p>

<table style="width: 100%; border-collapse: collapse; margin-top: 20px; margin-bottom: 30px;">
    <tr>
        <td style="padding: 10px; border-bottom: 1px solid #e5e7eb; color: #6b7280;">School Name:</td>
        <td style="padding: 10px; border-bottom: 1px solid #e5e7eb;"><strong>{{ school_name }}</strong></td>
    </tr>
    <tr>
        <td style="padding: 10px; border-bottom: 1px solid #e5e7eb; color: #6b7280;">Admin:</td>
        <td style="padding: 10px; border-bottom: 1px solid #e5e7eb;">{{ admin_name }} ({{ admin_email }})</td>
    </tr>
    <tr>
        <td style="padding: 10px; border-bottom: 1px solid #e5e7eb; color: #6b7280;">Phone:</td>
        <td style="padding: 10px; border-bottom: 1px solid #e5e7eb;">{{ admin_phone }}</td>
    </tr>
    <tr>
        <td style="padding: 10px; border-bottom: 1px solid #e5e7eb; color: #6b7280;">Plan:</td>
        <td style="padding: 10px; border-bottom: 1px solid #e5e7eb;">{{ plan }}</td>
    </tr>
</table>

<div style="text-align: center;">
    <a href="{{ review_url }}" style="display: inline-block; background-color: #047857; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold;">Review & Approve →</a>
</div>
{% endblock %}
